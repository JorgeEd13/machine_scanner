[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "machine-scanner"
version = "0.2.2"
description = "Portable, cross-platform machine inventory (hardware / OS / network) — JSON, text or HTML."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jorge Ribeiro" }]
keywords = ["inventory", "hardware", "diagnostics", "cross-platform", "system-info"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: System :: Hardware",
    "Topic :: System :: Systems Administration",
]
dependencies = ["psutil>=5.9"]

[project.optional-dependencies]
dev = ["pytest>=7"]
# Build-time only — PyInstaller freezes the binaries (ROADMAP F5). Kept out of
# the runtime deps and requirements.txt (ADR-001: psutil is the single runtime
# dependency); installed by the release workflow and for local builds.
build = ["pyinstaller>=6"]

[project.scripts]
machine-scanner = "machine_scanner.cli:main"
# The requirements check as its own command, mirroring its own binary (ADR-021).
ai-model-requirements = "machine_scanner.qualifier:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
