[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "machine-scanner"
version = "0.1.0"
description = "Portable, cross-platform machine inventory (hardware / OS / network) — JSON, text or HTML."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jorge Ribeiro" }]
keywords = ["inventory", "hardware", "diagnostics", "cross-platform", "system-info"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: System :: Hardware",
    "Topic :: System :: Systems Administration",
]
dependencies = ["psutil>=5.9"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
machine-scanner = "machine_scanner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
