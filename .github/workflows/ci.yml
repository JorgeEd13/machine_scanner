name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (package + dev extras)
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -v

      # A smoke run proves the CLI actually executes end-to-end on this OS,
      # not just that the unit tests (which stub hardware) pass.
      - name: Smoke run (text + JSON)
        run: |
          python -m machine_scanner --list
          python -m machine_scanner > /dev/null
          python -m machine_scanner --json > /dev/null
        shell: bash
