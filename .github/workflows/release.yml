name: Release

# Tag-triggered: pushing a v* tag (e.g. v0.1.0) builds the per-OS binaries and
# attaches them to a GitHub Release. This is separate from ci.yml on purpose —
# CI runs the test matrix on every push/PR; this only runs on a release tag and
# only builds artifacts (it does not duplicate the test matrix).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # allow a manual build without tagging (artifacts only)

permissions:
  contents: write # needed to create the Release and upload assets

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # One binary per OS from the same spec (PLAN's reality check: no single
        # binary runs everywhere). The spec names the artifact per platform.
        include:
          - os: windows-latest
            artifact: machine-scanner-windows.exe
          - os: ubuntu-latest
            artifact: machine-scanner-linux
          - os: macos-latest
            artifact: machine-scanner-macos

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install (package + build extra)
        run: python -m pip install --upgrade pip && python -m pip install -e ".[build]"

      - name: Build the one-file binary
        run: pyinstaller build/machine_scanner.spec --noconfirm

      # Prove the frozen binary actually runs on its OS before we ship it: the
      # self-registration risk (ADR-002) is that PyInstaller's static analysis
      # misses a collector, so we assert --list returns all 16.
      - name: Smoke test the binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $n = (& "dist/${{ matrix.artifact }}" --list | Where-Object { $_.Trim() -ne "" }).Count
          if ($n -ne 16) { Write-Error "expected 16 collectors, got $n"; exit 1 }
          & "dist/${{ matrix.artifact }}" --json > $null
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Smoke test the binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x "dist/${{ matrix.artifact }}"
          n=$("dist/${{ matrix.artifact }}" --list | sed '/^[[:space:]]*$/d' | wc -l)
          if [ "$n" -ne 16 ]; then echo "expected 16 collectors, got $n"; exit 1; fi
          "dist/${{ matrix.artifact }}" --json > /dev/null

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create / update the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
